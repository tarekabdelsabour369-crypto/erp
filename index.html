<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#12353a;--a:#b9781a;--bg:#eef2f1;--b:#d3dcda;--t:#17262a;--r:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{background:var(--p);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid var(--b)}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;color:var(--t)}
nav button.on{background:var(--p);color:#fff}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:#fff;border:1px solid var(--b);border-radius:6px;padding:14px;margin-bottom:14px;overflow-x:auto}
h3{margin:0 0 10px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}
th{background:#e4ebe9}
input,select{font:inherit;padding:8px;border:1px solid var(--b);border-radius:6px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a)}
button.b{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:var(--p);color:#fff;cursor:pointer}
button.b.y{background:var(--a)}
button.b.d{background:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.row label{display:flex;flex-direction:column;gap:3px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.k{font-size:22px;font-weight:600}
.pos{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:700px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pg button{padding:12px;border:1px solid var(--b);border-radius:6px;background:#fff;cursor:pointer;font:inherit}
.pg button:hover{border-color:var(--a)}
@media print{header,nav,.np{display:none}}
</style>
</head>
<body>
<div id="lg" class="card" style="max-width:330px;margin:70px auto">
<div style="text-align:center"><svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#12353a"/><path d="M24 9v27M14 37h20M24 13l-11 4M24 13l11 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M7 28l6-11 6 11a6 6 0 0 1-12 0zM29 28l6-11 6 11a6 6 0 0 1-12 0z" fill="#e0a030"/></svg><h2 style="margin:6px 0 0">ميزان</h2><small>نظام المحاسبة والموارد البشرية</small></div><h3 style="margin-top:14px">تسجيل الدخول</h3>

<script>
const SB_URL='https://fjzlexvgrgtlzrvotmlc.supabase.co',SB_KEY='sb_publishable_vgl3rKOBQ1-wsEgLzUEQ5w_3vXomKMn';

const PA={cash:'1000',card:'1010',wallet:'1020'};

const KEY='acc_db_v1';
let db,me,cur='dash',cart=[],pcart=[],posc=[];
const can=m=>me&&(me.is_admin||(me.perms||[]).includes(m));
const pn=id=>(db.products.find(p=>p.id==id)||{}).name||'؟';
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const nid=()=>Date.now()*10+Math.floor(Math.random()*10);
const prev=d=>new Date(new Date(d)-864e5).toISOString().slice(0,10);
let synced={inv:0,je:0};
async function save(){
  try{
    const jobs=[];
    if(db.products.length)jobs.push(sb.from('products').upsert(db.products));
    const ni=db.inv.slice(synced.inv).map(x=>({id:x.id,data:x})),nj=db.je.slice(synced.je).map(x=>({id:x.id,data:x}));
    if(ni.length)jobs.push(sb.from('invoices').upsert(ni));
    if(nj.length)jobs.push(sb.from('journal_entries').upsert(nj));
    const er=(await Promise.all(jobs)).find(x=>x.error);
    if(er)throw er.error;
    synced={inv:db.inv.length,je:db.je.length};
  }catch(e){alert('تعذر الحفظ على السيرفر: '+(e.message||e))}
}
async function signup(){
  const{error}=await sb.auth.signUp({email:$('#lu').value.trim(),password:$('#lp').value});
  $('#le').textContent=error?error.message:'تم إنشاء الحساب. إن طُلب تأكيد البريد فأكّده ثم سجّل الدخول.';
}

  const{data,error}=await sb.auth.signInWithPassword({email:$('#lu').value.trim(),password:$('#lp').value});
  if(error)return $('#le').textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة';

async function enter(u){
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();
  if(error||!p)return $('#le').textContent='تعذر تحميل الحساب. تأكد من تشغيل ملف setup.sql';
  me=p;
  const q=t=>sb.from(t).select('*');
  const[a,b,c,d,e,pa,ac,shf,em,hh]=await Promise.all([q('products'),q('invoices').order('id'),q('journal_entries').order('id'),q('settings'),q('profiles'),q('parties'),q('accounts'),q('shifts'),q('employees'),q('hr')]);
  db={products:(a.data||[]).map(x=>({...x,price:+x.price,q:+x.q,cost:+x.cost})),inv:(b.data||[]).map(x=>x.data),je:(c.data||[]).map(x=>x.data),vat:14,profiles:e.data||[],parties:(pa.data||[]).map(x=>x.data),shifts:(shf.data||[]).map(x=>x.data),emp:(em.data||[]).map(x=>x.data),hr:(hh.data||[]).map(x=>x.data)};
  ACC.push(...(ac.data||[]).map(x=>[x.code,x.name,x.type]));
  const v=(d.data||[]).find(x=>x.key=='vat');if(v)db.vat=+v.value;
  synced={inv:db.inv.length,je:db.je.length};
  $('#lg').style.display='none';$('#app').style.display='block';$('#who').textContent=me.name||me.email;
  go(can('dash')?'dash':(M.find(can)||'dash'));
}
async function boot(){
  const{data}=await sb.auth.getSession();
  if(data.session)await enter(data.session.user);
}
function go(m){
  cur=m;
  $('#nav').innerHTML=M.filter(can).map(x=>`<button class="${x==m?'on':''}" onclick="go('${x}')">${MN[x]}</button>`).join('');
  $('#main').innerHTML=can(m)?V[m]():'<div class="card">لا تملك صلاحية لفتح هذه الشاشة. تواصل مع المدير.</div>';
  if(!can(m))return;
  if(m=='sales'){fillPr('S');lnr('S')}
  if(m=='purchases'){fillPr('P');lnr('P')}
  if(m=='pos'&&curSh()){pg();posr()}
}

/* ====== المحاسبة (قيد مزدوج) ====== */
function post(d,desc,lines,ref){
  const dr=r2(lines.reduce((s,l)=>s+l[1],0)),cr=r2(lines.reduce((s,l)=>s+l[2],0));
  if(dr!=cr)throw Error('القيد غير متوازن');
  db.je.push({id:nid(),d,desc,ref:ref||'',l:lines});
}
function bal(to,from){
  const m={};ACC.forEach(a=>m[a[0]]=0);
  db.je.forEach(j=>{if((!to||j.d<=to)&&(!from||j.d>=from))j.l.forEach(l=>m[l[0]]=r2(m[l[0]]+l[1]-l[2]))});
  return m;
}
function sale(party,pay,items,d,pid,disc,pays){
  if(pay=='credit'&&!pid)throw Error('اختر عميلاً للبيع الآجل');
  const need={};items.forEach(i=>need[i.id]=(need[i.id]||0)+i.q);
  for(const id in need){const p=db.products.find(x=>x.id==id);if(!p||p.q<need[id])throw Error('الكمية غير كافية: '+pn(id))}
  let net=0,cogs=0;
  items.forEach(i=>{const p=db.products.find(x=>x.id==i.id);net+=i.q*i.pr;cogs+=i.q*p.cost;p.q-=i.q});
  net=r2(net-(disc||0));cogs=r2(cogs);
  const tax=r2(net*db.vat/100),tot=r2(net+tax),id=nid();
  db.inv.push({id,t:'S',d,party,pid,pay,l:items,net,tax,tot,disc:disc||0,pays});
  post(d,'فاتورة مبيعات #'+id,[...(pays?pays.map(x=>[PA[x.m],x.a,0]):[[pay=='cash'?'1000':'1100',tot,0,pid]]),['4000',0,net],['2100',0,tax],['5000',cogs,0],['1200',0,cogs]],'S'+id);
  return id;
}
function purchase(party,pay,items,d,pid){
  if(pay=='credit'&&!pid)throw Error('اختر مورداً للشراء الآجل');
  let net=0;
  items.forEach(i=>{const p=db.products.find(x=>x.id==i.id);const v=i.q*i.pr;p.cost=r2((p.q*p.cost+v)/(p.q+i.q));p.q+=i.q;net+=v});
  net=r2(net);
  const tax=r2(net*db.vat/100),tot=r2(net+tax),id=nid();
  db.inv.push({id,t:'P',d,party,pid,pay,l:items,net,tax,tot});
  post(d,'فاتورة مشتريات #'+id,[['1200',net,0],['1300',tax,0],[pay=='cash'?'1000':'2000',0,tot,pid]],'P'+id);
  return id;
}

/* ====== الفواتير ====== */
function fillPr(t){
  const p=db.products.find(x=>x.id==$('#ip').value);
  $('#ipr').value=p?(t=='S'?p.price:p.cost):'';
}
function lnr(t){
  const L=t=='S'?cart:pcart,tot=L.reduce((s,l)=>s+l.q*l.pr,0);
  $('#ln').innerHTML=tbl(['الصنف','الكمية','السعر','الإجمالي',''],L.map((l,i)=>[esc(pn(l.id)),l.q,f(l.pr),f(l.q*l.pr),`<button class="b d" onclick="delL('${t}',${i})">حذف</button>`]))+
  `<p>الصافي: ${f(tot)} | ضريبة ${db.vat}%: ${f(tot*db.vat/100)} | الإجمالي: <b>${f(tot*(1+db.vat/100))}</b></p>`;
}
function addL(t){
  const id=+$('#ip').value,q=+$('#iq').value,pr=+$('#ipr').value;
  if(!id||q<=0||pr<0)return alert('اختر صنفاً وأدخل كمية وسعراً صحيحين');
  (t=='S'?cart:pcart).push({id,q,pr});lnr(t);
}
function delL(t,i){(t=='S'?cart:pcart).splice(i,1);lnr(t)}
function saveInv(t){
  const L=t=='S'?cart:pcart;
  if(!L.length)return alert('الفاتورة فارغة');
  try{
    const pid=+$('#pt').value||0,pr=db.parties.find(x=>x.id==pid),a=[pr?pr.name:(t=='S'?'عميل نقدي':'مورد عام'),$('#py').value,L.map(l=>({...l})),$('#dt').value||today(),pid];
    const id=t=='S'?sale(...a):purchase(...a);
    save();L.length=0;go(cur);alert('تم حفظ الفاتورة رقم '+id);
  }catch(e){alert(e.message)}
}
const list=t=>`<div class="card"><h3>آخر الفواتير</h3>${tbl(['#','التاريخ','الطرف','الدفع','الصافي','الضريبة','الإجمالي',''],db.inv.filter(i=>i.t[0]==t).slice(-20).reverse().map(i=>[i.id,i.d,esc(i.party),i.pay=='cash'?'نقدي':'آجل',f(i.net),f(i.tax),f(i.tot),i.t.length>1?'مرتجع للفاتورة '+i.ref:`<button class="b d" onclick="openRet(${i.id})">فاتورة مرتجع</button>`]))}</div>`;
function invUI(t){
  const S=t=='S';
  return `<div class="card"><h3>${S?'فاتورة مبيعات':'فاتورة مشتريات'}</h3>
  <div class="row"><label>${S?'العميل':'المورد'}<select id="pt"><option value="">${S?'عميل نقدي':'مورد عام'}</option>${db.parties.filter(p=>p.type==(S?'C':'S')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>التاريخ<input id="dt" type="date" value="${today()}"></label>
  <label>الدفع<select id="py"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label></div>
  <div class="row"><label>الصنف<select id="ip" onchange="fillPr('${t}')">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.q})</option>`).join('')}</select></label>
  <label>الكمية<input id="iq" type="number" min="1" value="1" style="width:90px"></label>
  <label>السعر<input id="ipr" type="number" step="0.01" style="width:110px"></label>
  <button class="b y" onclick="addL('${t}')">إضافة للفاتورة</button></div>
  <div id="ln"></div><button class="b" onclick="saveInv('${t}')">حفظ الفاتورة</button></div>${list(t)}<div id="retbox"></div>`;
}

/* ====== نقاط البيع ====== */
const curSh=()=>db.shifts.find(x=>!x.close&&x.uid==me.id);
const tm=x=>String(x).slice(0,16).replace('T',' ');
function pg(){
  const q=($('#ps').value||'').trim();
  $('#pg').innerHTML=db.products.filter(p=>p.name.includes(q)||(p.code||'').includes(q)).map(p=>`<button onclick="padd(${p.id})"><b>${esc(p.name)}</b><br>${f(p.price)}<br><small>متاح: ${p.q}</small></button>`).join('')||'لا توجد أصناف. أضفها من شاشة المخازن.';
}
function scan(){
  const v=$('#ps').value.trim(),p=db.products.find(x=>x.code&&x.code==v);
  if(p){padd(p.id);$('#ps').value='';pg()}
}
function padd(id){
  const p=db.products.find(x=>x.id==id);let l=posc.find(x=>x.id==id);
  if((l?l.q:0)+1>p.q)return alert('الكمية المتاحة غير كافية');
  if(l)l.q++;else posc.push({id,q:1,pr:p.price,dp:0});
  posr();
}
function pq2(i,d){
  const l=posc[i],p=db.products.find(x=>x.id==l.id);
  if(l.q+d>p.q)return alert('الكمية المتاحة غير كافية');
  l.q+=d;if(l.q<=0)posc.splice(i,1);posr();
}
function pdp(i,v){posc[i].dp=Math.min(100,Math.max(0,+v||0));posr()}
const posItems=()=>posc.map(l=>({id:l.id,q:l.q,pr:r2(l.pr*(1-(l.dp||0)/100))}));
function posTot(){
  const it=posItems(),sub=r2(it.reduce((s,i)=>s+i.q*i.pr,0)),dv=Math.min(sub,Math.max(0,r2(+($('#dv')?$('#dv').value:0)||0))),net=r2(sub-dv),tax=r2(net*db.vat/100);
  return{sub,dv,net,tax,tot:r2(net+tax),gross:r2(posc.reduce((s,l)=>s+l.q*l.pr,0))};
}
function posr(){
  const T=posTot();
  $('#pcv').innerHTML=`<table>${posc.map((l,i)=>`<tr><td>${esc(pn(l.id))}</td><td><button onclick="pq2(${i},-1)">-</button> ${l.q} <button onclick="pq2(${i},1)">+</button></td><td><input type="number" min="0" max="100" value="${l.dp||0}" onchange="pdp(${i},this.value)" style="width:60px" title="خصم %">%</td><td>${f(l.q*l.pr*(1-(l.dp||0)/100))}</td></tr>`).join('')}</table>`;
  $('#ptot').innerHTML=`<p>الصافي بعد الخصم: ${f(T.net)}<br>الضريبة: ${f(T.tax)}<br><b>الإجمالي: ${f(T.tot)}</b></p>`;
}
function payPos(){
  const sh=curSh();
  if(!sh)return alert('افتح وردية أولاً');
  if(!posc.length)return alert('السلة فارغة');
  const T=posTot(),cd=r2(+$('#pcd').value||0),wl=r2(+$('#pwl').value||0),due=r2(T.tot-cd-wl),rc=$('#pcr').value===''?due:r2(+$('#pcr').value);
  if(due<0)return alert('مبلغ البطاقة والمحفظة أكبر من الإجمالي');
  if(rc<due)return alert('النقدية المستلمة أقل من المطلوب');
  try{
    const pays=[{m:'cash',a:due},{m:'card',a:cd},{m:'wallet',a:wl}].filter(x=>x.a>0);
    const id=sale('عميل نقدي','cash',posItems(),today(),0,T.dv,pays),o=db.inv.find(x=>x.id==id);
    o.sh=sh.id;o.change=r2(rc-due);
    const t=sh.t;t.cash=r2(t.cash+due);t.card=r2(t.card+cd);t.wallet=r2(t.wallet+wl);t.n++;t.disc=r2(t.disc+T.gross-T.net);
    sb.from('shifts').upsert({id:sh.id,data:sh}).then(r=>{if(r.error)alert(r.error.message)});
    save();lastInv=id;posc=[];
    ['dv','pcd','pwl','pcr'].forEach(k=>$('#'+k).value=k=='dv'?0:'');
    posr();pg();rcpt(id);
  }catch(e){alert(e.message)}
}
function pw(h){
  const w=open('','_blank','width=400,height=650');

function doRet(id){
  const o=db.inv.find(x=>x.id==id),S=o.t=='S',done={},items=[];
  db.inv.filter(x=>x.ref==id).forEach(r=>r.l.forEach(i=>done[i.id]=(done[i.id]||0)+i.q));
  try{
    document.querySelectorAll('.rq').forEach(el=>{
      const i=o.l[+el.dataset.k],q=+el.value;
      if(q<=0)return;
      if(q>i.q-(done[i.id]||0))throw Error('كمية المرتجع أكبر من المتاح للصنف: '+pn(i.id));
      items.push({id:i.id,q,pr:i.pr});
    });
    if(!items.length)throw Error('أدخل كمية مرتجع لصنف واحد على الأقل');
    const net=r2(items.reduce((s,i)=>s+i.q*i.pr,0)*(o.disc?o.net/(o.net+o.disc):1)),tax=o.net?r2(net*o.tax/o.net):0,tot=r2(net+tax),d=today(),acc=o.pay=='cash'?'1000':(S?'1100':'2000');
    if(S){
      const j=db.je.find(x=>x.ref=='S'+id),tq=o.l.reduce((s,i)=>s+i.q,0),uc=j&&tq?j.l.find(l=>l[0]=='5000')[1]/tq:0,cg=r2(items.reduce((s,i)=>s+i.q,0)*uc);
      items.forEach(i=>{const p=db.products.find(x=>x.id==i.id);if(p){p.cost=r2((p.q*p.cost+i.q*uc)/(p.q+i.q));p.q+=i.q}});
      post(d,'مرتجع مبيعات للفاتورة '+id,[['4000',net,0],['2100',tax,0],[acc,0,tot,o.pid],['1200',cg,0],['5000',0,cg]],'SR'+id);
    }else{
      items.forEach(i=>{const p=db.products.find(x=>x.id==i.id);if(!p||p.q<i.q)throw Error('الكمية غير كافية للإرجاع: '+pn(i.id))});
      items.forEach(i=>{db.products.find(x=>x.id==i.id).q-=i.q});
      post(d,'مرتجع مشتريات للفاتورة '+id,[[acc,tot,0,o.pid],['1200',0,net],['1300',0,tax]],'PR'+id);
    }
    db.inv.push({id:nid(),t:S?'SR':'PR',d,party:o.party,pid:o.pid,pay:o.pay,l:items,net,tax,tot,ref:id});
    save();go(cur);alert('تم تسجيل فاتورة المرتجع');
  }catch(e){alert(e.message)}
}

function calc(e,m){
  const g=k=>db.hr.filter(x=>x.k==k&&x.eid==e.id),dr=(e.basic+e.allow)/30,at=g('att').filter(x=>x.d.startsWith(m));
  const ab=at.filter(x=>x.st=='a').length,lt=at.reduce((s,x)=>s+(+x.late||0),0);
  const up=g('lv').filter(x=>x.st=='ok'&&x.type=='unpaid'&&x.from.startsWith(m)).reduce((s,x)=>s+x.days,0);
  const aj=g('adj').filter(x=>x.m==m),sm=t=>aj.filter(x=>x.type==t).reduce((s,x)=>s+x.amt,0);
  const loan=r2(g('ln').reduce((s,x)=>s+Math.min(x.inst,x.amt-x.paid),0)),bonus=r2(sm('bonus')+sm('commission')),pen=r2(sm('penalty'));
  const abd=r2(ab*dr),ltd=r2(lt/480*dr),upd=r2(up*dr),ins=r2(e.basic*(e.insp||0)/100),gross=r2(e.basic+e.allow+bonus),ded=r2(abd+ltd+upd+pen);
  return{id:e.id,name:e.name,basic:e.basic,allow:e.allow,bonus,abd,ltd,upd,pen,ins,loan,gross,ded,net:r2(gross-ded-ins-loan)};
}

/* ====== التقارير ====== */
function rep(){
  const t=$('#rt').value,fr=$('#rf').value,to=$('#rto').value;let h='';
  const nm=k=>ACC.find(a=>a[0]==k)[1];
  if(t=='tb'){
    const b=bal(to);let D=0,C=0;
    h=tbl(['الكود','الحساب','مدين','دائن'],ACC.map(a=>{const v=b[a[0]];if(v>0)D+=v;else C-=v;return[a[0],a[1],v>0?f(v):'',v<0?f(-v):'']}).concat([['','<b>الإجمالي</b>',f(D),f(C)]]));
  }
  if(t=='is'){
    const b=bal(to,fr),sm=(y,x)=>ACC.filter(a=>a[2]==y&&a[0]!=x).reduce((s,a)=>s+b[a[0]],0),rv=-sm('R'),cg=b['5000'],ex=sm('X','5000'),gp=rv-cg;
    h=tbl(['البند','المبلغ'],[['الإيرادات',f(rv)],['تكلفة المبيعات',f(cg)],['<b>مجمل الربح</b>',f(gp)],['المصروفات التشغيلية',f(ex)],['<b>صافي الربح (الخسارة)</b>',f(gp-ex)]]);
  }
  if(t=='bs'){
    const b=bal(to),np=npf(b);
    const A=ACC.filter(a=>a[2]=='A').map(a=>a[0]),L=ACC.filter(a=>a[2]=='L').map(a=>a[0]),E=ACC.filter(a=>a[2]=='E').map(a=>a[0]);
    const sum=(a,s)=>a.reduce((x,k)=>x+s*b[k],0);
    h=tbl(['البند','المبلغ'],[['<b>الأصول</b>',''],...A.map(k=>[nm(k),f(b[k])]),['<b>إجمالي الأصول</b>',f(sum(A,1))],
      ['<b>الالتزامات</b>',''],...L.map(k=>[nm(k),f(-b[k])]),['<b>إجمالي الالتزامات</b>',f(sum(L,-1))],
      ['<b>حقوق الملكية</b>',''],...E.map(k=>[nm(k),f(-b[k])]),['أرباح الفترة',f(np)],['<b>إجمالي حقوق الملكية</b>',f(sum(E,-1)+np)],
      ['<b>إجمالي الالتزامات وحقوق الملكية</b>',f(sum(L,-1)+sum(E,-1)+np)]]);
  }
  if(t=='gl'){
    const k=$('#ra').value;let r=0;const rows=[];
    db.je.filter(j=>(!to||j.d<=to)&&(!fr||j.d>=fr)).forEach(j=>j.l.forEach(l=>{if(l[0]==k){r=r2(r+l[1]-l[2]);rows.push([j.d,esc(j.desc),l[1]?f(l[1]):'',l[2]?f(l[2]):'',f(r)])}}));
    h=tbl(['التاريخ','البيان','مدين','دائن','الرصيد'],rows);
  }
  if(t=='vat'){
    const b=bal(to,fr);
    h=tbl(['البند','المبلغ'],[['ضريبة المخرجات (المبيعات)',f(-b['2100'])],['ضريبة المدخلات (المشتريات)',f(b['1300'])],['<b>الضريبة المستحقة للسداد</b>',f(-b['2100']-b['1300'])]]);
  }
  if(t=='sh')h=tbl(['الكاشير','الفتح','الإقفال','المتوقع','الفعلي','الفرق','الفواتير'],db.shifts.filter(x=>x.close).reverse().map(x=>[esc(x.name),tm(x.open),tm(x.close),f(x.expected),f(x.counted),f(x.diff),x.t.n]));
  if(t=='pa'){
    const pt=db.parties.find(x=>x.id==+$('#rp').value);
    if(pt){
      const k=pt.type=='C'?'1100':'2000',sg=pt.type=='C'?1:-1;let r=0;const rows=[];
      db.je.filter(j=>(!to||j.d<=to)&&(!fr||j.d>=fr)).forEach(j=>j.l.forEach(l=>{if(l[0]==k&&l[3]==pt.id){r=r2(r+sg*(l[1]-l[2]));rows.push([j.d,esc(j.desc),l[1]?f(l[1]):'',l[2]?f(l[2]):'',f(r)])}}));
      h='<p><b>'+esc(pt.name)+'</b></p>'+tbl(['التاريخ','البيان','مدين','دائن','الرصيد'],rows);
    }else h='لا يوجد عملاء أو موردون بعد.';
  }
  if(t=='cf'){
    let op=0,fin=0;
    db.je.filter(j=>(!to||j.d<=to)&&(!fr||j.d>=fr)).forEach(j=>j.l.forEach(l=>{if(l[0]=='1000'){const v=l[1]-l[2];if(j.l.some(x=>x[0]=='3000'||x[0]=='3100'))fin+=v;else op+=v}}));
    const o=bal(fr?prev(fr):'0000-00-00')['1000'];
    h=tbl(['البند','المبلغ'],[['التدفقات النقدية من الأنشطة التشغيلية',f(op)],['التدفقات النقدية من الأنشطة التمويلية',f(fin)],['<b>صافي التغير في النقدية</b>',f(op+fin)],['النقدية أول الفترة',f(o)],['<b>النقدية آخر الفترة</b>',f(o+op+fin)]]);
  }
  if(t=='eq'){
    const b0=bal(fr?prev(fr):'0000-00-00'),b1=bal(to),re=b=>npf(b);
    const ce=b=>-ACC.filter(a=>a[2]=='E').reduce((s,a)=>s+b[a[0]],0),c0=ce(b0),c1=ce(b1),r0=re(b0),r1=re(b1);
    h=tbl(['البند','رأس المال','الأرباح المحتجزة','الإجمالي'],[['الرصيد أول الفترة',f(c0),f(r0),f(c0+r0)],['زيادة رأس المال',f(c1-c0),'',f(c1-c0)],['ربح (خسارة) الفترة','',f(r1-r0),f(r1-r0)],['<b>الرصيد آخر الفترة</b>',f(c1),f(r1),f(c1+r1)]]);
  }
  if(t=='nt')h=`<ol><li>أساس الإعداد: مبدأ الاستحقاق، وهيكل العرض وفق معيار IAS 1.</li><li>المخزون يُقاس بالتكلفة بطريقة المتوسط المرجح (IAS 2).</li><li>الإيراد يُثبت عند إصدار فاتورة البيع (IFRS 15).</li><li>ضريبة القيمة المضافة بنسبة ${db.vat}% وتُعرض التزاماً أو أصلاً حسب رصيدها.</li><li>قائمة التدفقات النقدية بالطريقة المباشرة، وتصنّف حركة النقدية إلى تشغيلية وتمويلية.</li><li>عملة العرض هي عملة النظام، ولا توجد معاملات بعملات أجنبية.</li></ol>`;
  $('#ro').innerHTML=`<h3>${$('#rt').selectedOptions[0].text}</h3>`+h;
}
