function mvOf(p,w){

  db.mvs.filter(m=>m.pid==p.id).forEach(m=>{

  const col=r2(db.je.filter(j=>j.rep==r.id&&j.d.startsWith(m)&&j.ref.startsWith('RV')).reduce((s,j)=>s+j.l.find(l=>l[1]>0)[1],0));
  return{sales,col,vis:db.visits.filter(v=>v.rid==r.id&&v.d.startsWith(m)).length,orders:iv.filter(i=>i.t=='S').length,com:r2(sales*r.cs/100+col*r.cc/100),pct:r.target?Math.round(sales/r.target*100):0};
}

function edSave(t,k){
  const o=edObj(t,k),v={};
  for(const f of EF[t]){const e=$('#ef_'+f[0]);v[f[0]]=f[2]=='b'?e.checked:f[2]=='n'?(+e.value||0):e.value.trim()}
  if(EF[t].some(q=>q[0]=='name')&&!v.name)return alert('الاسم مطلوب');
  if(t=='acc'){
    const a=ACC.find(x=>x[0]==k),used=db.je.some(j=>j.l.some(l=>l[0]==k)),par=ACC.find(x=>x[0]==v.parent);
    if(SYS.includes(k)&&(v.type!=a[2]||v.hdr))return alert('حساب أساسي في النظام: لا يمكن تغيير نوعه أو جعله تجميعيًا');
    if(v.hdr&&!a[6]&&used)return alert('الحساب عليه حركات ولا يمكن تحويله إلى تجميعي');
    if(kids(k).some(c=>c[2]!=v.type))return alert('فروع هذا الحساب من نوع مختلف');
    if(v.parent&&(!par||!par[6]||par[2]!=v.type))return alert('الأب لازم يكون حساب تجميعي من نفس النوع');
    for(let x=par;x;x=ACC.find(y=>y[0]==x[4]))if(x[0]==k)return alert('لا يمكن نقل الحساب تحت أحد فروعه');
    if(v.hdr&&v.ctl)return alert('الحساب التجميعي لا يكون حساب مراقبة');
    a[1]=v.name;a[2]=v.type;a[3]=v.kind||null;a[4]=v.parent||null;a[5]=v.ctl;a[6]=v.hdr;
    upAcc({code:k,name:v.name,type:v.type,kind:a[3],parent:a[4],ctl:a[5],hdr:a[6]});
  }else if(t=='cc'){o.name=v.name;upAcc({code:k,name:v.name,type:'CC'})}
  else if(t=='prod'){
    if(v.code&&db.products.some(p=>p.code==v.code&&p!=o))return alert('الباركود مستخدم لصنف آخر');
    Object.assign(o,{name:v.name,code:v.code||null,price:v.price,grp:v.grp||null});save();
  }else if(t=='wh'){
    if(o.id=='w0')return alert('المخزن الرئيسي الافتراضي لا يُعاد تسميته');
    o.name=v.name;put('inv',{id:+o.id,k:'wh',name:v.name});
  }else{Object.assign(o,v);put({emp:'employees',party:'parties',grp:'inv',loc:'inv',rep:'inv'}[t]||'inv',o)}
  alert('تم حفظ التعديل');go('edit');
}

const kids=c=>ACC.filter(a=>a[4]==c),isHdr=a=>!!a[6]||kids(a[0]).length>0,postable=a=>!!a&&!a[5]&&!isHdr(a);

function accTree(){
  const b=bal(),rows=[];

async function impX(ev){
  const file=ev.target.files[0];if(!file)return;
  const k=$('#it').value,t=TPL[k];let rows;
  try{const wb=XLSX.read(await file.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}catch(e){return alert('تعذر قراءة الملف')}
  if(!rows.length||t.h.some(h=>!(h in rows[0])))return alert('أعمدة الملف لا تطابق النموذج. حمّل النموذج واستخدمه كما هو.');
  if(!confirm('استيراد '+rows.length+' صف إلى: '+t.n+'؟'))return;
  let ok=0;const er=[],np=[],sx=v=>String(v).trim();
  rows.forEach((r,i)=>{
    try{
      if(k=='prod'){
        const name=sx(r['الاسم']),price=+r['سعر البيع'],q=+r['الكمية']||0,cost=+r['التكلفة']||0,code=sx(r['الباركود'])||null;
        if(!name||!(price>=0)||q<0||cost<0||(code&&db.products.some(p=>p.code==code)))throw 0;
        db.products.push({id:nid(),name,price,q,cost,code});
        if(q>0&&cost>0){const v=r2(q*cost);post(today(),'رصيد افتتاحي: '+name,[['1200',v,0],['3100',0,v]])}
      }
      if(k=='party'){
        const name=sx(r['الاسم']),ty={'عميل':'C','مورد':'S'}[sx(r['النوع'])],ob=r2(+r['الرصيد الافتتاحي']||0);
        if(!name||!ty)throw 0;
        const p={id:nid(),type:ty,name,phone:sx(r['الهاتف'])};db.parties.push(p);np.push({id:p.id,data:p});
        if(ob>0)post(today(),'رصيد افتتاحي: '+name,ty=='C'?[['1100',ob,0,p.id],['3100',0,ob]]:[['3100',ob,0],['2000',0,ob,p.id]]);
      }
      if(k=='emp'){
        const name=sx(r['الاسم']),b=+r['الراتب الأساسي'];
        if(!name||!(b>0))throw 0;
        const e={id:nid(),name,job:sx(r['الوظيفة']),dept:sx(r['القسم']),hire:xd(r['تاريخ التعيين']),phone:sx(r['الهاتف']),natid:sx(r['الرقم القومي']),basic:b,allow:+r['البدلات']||0,insp:+r['نسبة التأمينات']||0,status:'active'};
        db.emp.push(e);np.push({id:e.id,data:e});
      }
      if(k=='acc'){
        const code=sx(r['الكود']),name=sx(r['الاسم']),ty=TYM[sx(r['النوع'])];
        if(!/^\d{3,6}$/.test(code)||!name||!ty||ACC.some(a=>a[0]==code))throw 0;
        ACC.push([code,name,ty]);np.push({code,name,type:ty});
      }
      if(k=='ob'){
        const kk=sx(r['كود الحساب']),d=r2(+r['مدين']||0),c=r2(+r['دائن']||0);
        if(!ACC.some(a=>a[0]==kk)||!postable(ACC.find(a=>a[0]==kk))||kk=='3100'||(d>0)==(c>0))throw 0;
        post(today(),'رصيد افتتاحي: '+kk,d>0?[[kk,d,0],['3100',0,d]]:[['3100',c,0],[kk,0,c]]);

  go('setup');

  }

    const b=bal(to,fr),sm=(y,x)=>ACC.filter(a=>a[2]==y&&a[0]!=x).reduce((s,a)=>s+b[a[0]],0),rv=-sm('R'),cg=b['5000'],ex=sm('X','5000'),gp=rv-cg;
    h=tbl(['البند','المبلغ'],[['الإيرادات',f(rv)],['تكلفة المبيعات',f(cg)],['<b>مجمل الربح</b>',f(gp)],['المصروفات التشغيلية',f(ex)],['<b>صافي الربح (الخسارة)</b>',f(gp-ex)]]);
  }

    const sum=(a,s)=>a.reduce((x,k)=>x+s*b[k],0);
    h=tbl(['البند','المبلغ'],[['<b>الأصول</b>',''],...A.map(k=>[nm(k),f(b[k])]),['<b>إجمالي الأصول</b>',f(sum(A,1))],
      ['<b>الالتزامات</b>',''],...L.map(k=>[nm(k),f(-b[k])]),['<b>إجمالي الالتزامات</b>',f(sum(L,-1))],
      ['<b>حقوق الملكية</b>',''],...E.map(k=>[nm(k),f(-b[k])]),['أرباح الفترة',f(np)],['<b>إجمالي حقوق الملكية</b>',f(sum(E,-1)+np)],

  }

    db.je.filter(j=>(!to||j.d<=to)&&(!fr||j.d>=fr)).forEach(j=>j.l.forEach(l=>{if(l[0]==k){r=r2(r+l[1]-l[2]);rows.push([j.d,esc(j.desc),l[1]?f(l[1]):'',l[2]?f(l[2]):'',f(r)])}}));
    h=tbl(['التاريخ','البيان','مدين','دائن','الرصيد'],rows);
  }
  if(t=='vat'){

  }

    db.je.filter(j=>(!to||j.d<=to)&&(!fr||j.d>=fr)).forEach(j=>j.l.forEach(l=>{const a=ACC.find(x=>x[0]==l[0]);if(!a||!'RX'.includes(a[2]))return;const k=l[4]||'';m[k]=m[k]||{r:0,x:0};if(a[2]=='R')m[k].r+=l[2]-l[1];else m[k].x+=l[1]-l[2]}));
    h=tbl(['مركز التكلفة','الإيرادات','المصروفات','الصافي'],Object.keys(m).map(k=>[esc(nm[k]||'بدون مركز تكلفة'),f(m[k].r),f(m[k].x),f(m[k].r-m[k].x)]));
  }

      const k=pt.type=='C'?'1100':'2000',sg=pt.type=='C'?1:-1;let r=0;const rows=[];

      h='<p><b>'+esc(pt.name)+'</b></p>'+tbl(['التاريخ','البيان','مدين','دائن','الرصيد'],rows);

  $('#ro').innerHTML=`<h3>${$('#rt').selectedOptions[0].text}</h3>`+h;
}
